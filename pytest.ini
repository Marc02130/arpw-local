[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: fast tests with no Docker
    uat: user-acceptance against the Compose stack
    dogfood: live operator walkthrough of the running stack
    slice01: Compose scaffold
    slice02: Alembic schema
    slice03: auth API
    slice04: LLM keys
    slice05: document ingest
    slice06: papers and retrieve
    slice07: pins
    slice08: interrogate
    slice09: generate
    slice10: library
    slice11: README and UAT
    slice12: keyboard
addopts = -q -m "unit"
